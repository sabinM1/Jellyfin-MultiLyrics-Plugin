name: "Multi-Lyrics"
guid: "7c1e4a9e-52b8-4c2f-9a3d-6e8f1b2c4d5e"
version: "1.0.0.1"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "Multi-Lyrics contributors"
overview: "Fetch lyrics from multiple sources in a configurable priority order (LRCLIB, lyrics.ovh, Tekstowo, Genius)"
description: >
  Multi-Lyrics queries lyric sources in a user-configurable priority queue, records whether
  each result is synced, plain or instrumental, serves the lyrics for the track being played
  through GET /Audio/{id}/Lyrics, keeps a per-source retry cache, exposes an admin-only manual
  search/status API, and can optionally call a companion Demucs+WhisperX service to align plain
  lyrics into word-level timings. Lyrics are ephemeral: fetched on demand and held in memory
  only, never written to the library or metadata folder.
  Genius scraping is OFF by default and requires an explicit Terms-of-Service acknowledgement.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.MultiLyrics.dll"
  # Third-party runtime dependency: must ship in the plugin zip or loading fails at runtime.
  # Every other assembly in the publish output is provided by the Jellyfin server.
  - "HtmlAgilityPack.dll"
changelog: |-
  ## v1.0.0.1
  - **Unused sidecar settings removed.** `WritePolicy`, `OverwritePolicy` and `MaxTracksPerRun`
    had no readers left. A configuration written by an older build still loads: unknown elements
    are ignored and disappear the next time the settings page is saved.
  - **The Genius mode in the file now matches what runs.** It follows the Genius toggle, so a
    retired `SearchOnly` left behind by an older build can no longer invalidate the retry cache.
  - **Docs corrected.** The Genius reference no longer claims a mode selector or a required token,
    *Restore defaults* is described as it behaves, and the pre-release verification log is gone.
  ## v1.0.0.0
  ### First public release
  - **Multi-source lyrics in a priority order.** LRCLIB (synced, always enabled), lyrics.ovh,
    Tekstowo and Genius are queried in the order you set; a synced result ends the search and a
    plain result is kept as a fallback.
  - **Ephemeral by design.** Lyrics are fetched on demand and held in memory for the track being
    played only: they are dropped on the next song, on a miss, when playback stops and on restart.
    Nothing is written to the library or to Jellyfin's metadata folder.
  - **Honest status.** Every result is Synced, Plain or Instrumental, and each sweep logs one line
    naming every source's verdict and the winner, so a miss says why.
  - **Settings page.** Per-source toggles and priorities, "Prefer synced lyrics", the Genius
    Terms-of-Service gate with an optional client access token, and Restore defaults.
  - **Per-source retry cache.** Misses escalate 1/3/7/30 days per source and a transient failure
    waits 10 minutes. The cache never holds lyric text.
  - **Admin API.** `POST /MultiLyrics/Search/{itemId}` and `GET /MultiLyrics/Status/{itemId}`.

  ## v0.15.0.0
  ### Changes
  - **The settings page draws its own controls.** The enable checkboxes and the priority dropdowns
    used to fall back to native controls next to themed ones - a bare white square and a plain
    browser select with no arrow. They now look like the rest of the dashboard.
  - **LRCLIB can no longer be switched off.** It is the primary source of synced lyrics, so its
    toggle is locked on and the queue always contains it.
  - **Genius has no mode selector any more.** Enabling Genius always means scraping the song page,
    so the legal note appears as soon as it is ticked, and the retired metadata-only mode is gone
    (a `SearchOnly` left in an older configuration is treated as `Scrape`).
  - **The Genius client access token is optional.** Without one the public genius.com search finds
    the song page; with one the official API is used.
  - **Restore defaults updates the whole page and saves itself.** It used to reset only the source
    table and wait for a manual Save; it now also resets "Prefer synced lyrics" and stores the
    result immediately.
  ### Fixes
  - The notes no longer claim a 102-test suite: the suite is **137 tests**.

  ## v0.14.0.0
  ### Fixes
  - **Saving the settings page no longer fails with a 500 on an unset Genius mode.** When the host
    returned a mode the page did not recognise, the dropdown rendered blank and the save posted
    `null`; the host could not convert that to the mode enum and rejected the whole request, so no
    setting at all was stored. The value is normalised now, and a blank or unknown mode falls back
    to "Off" instead of failing.
  - **Lyrics are dropped when playback stops** rather than staying in memory until the two-hour
    TTL when no other track replaced them. They were never on disk, and a restart still clears them.
  - **The configuration stamp carries the Genius mode again.** It held the literal text
    `{(int)cfg.GeniusMode}`, so changing only the Genius mode did not reset the per-source retry
    windows.

  ## v0.13.0.0
  ### New
  - **"Prefer synced lyrics over the priority order" switch.** A synced result always beat a
    plain one, so a plain-only source (Genius scrape, Tekstowo) could never be the result you
    saw while LRCLIB was enabled: Genius reported a successful scrape for every track, yet the
    player always showed the LRCLIB text. With the switch off the priority order is literal -
    the first source that returns any lyrics wins, which is also the only way to verify what a
    plain source actually returned. Default stays on (previous behaviour).

  ## v0.12.0.0
  ### Fixes
  - **Genius now says why it found nothing.** The source returned a bare `null` for every miss, so a
    rejected token, a Cloudflare challenge, a search-only mode and "Genius does not have this
    track" all looked identical - and nothing was logged at all when another source won, which is
    the normal case (synced lyrics from LRCLIB beat a plain Genius result). Every source now
    returns a reason, and each sweep logs one line naming every source's verdict and the winner.
  - **A track solved earlier is fetched again.** The cache remembered the win and `ShouldSkip`
    treated any recorded result as "already have lyrics". Because the text is never persisted, a
    track fetched in an earlier session (or evicted by the next song) could never be fetched
    again - it answered "no lyrics" forever. Only misses gate a fetch now.
  - **One source missing a track no longer blocks the others.** The retry window was stored per
    track and ignored the source name, so a 404 from any source suppressed the whole sweep for
    1/3/7/30 days. Windows are per source, and a transient failure (timeout, 429/5xx, Cloudflare
    challenge) now waits 10 minutes instead of a day.
  - **Changing the sources clears every window.** A configuration or version change previously
    bypassed the windows for a single sweep, so tracks missed under the old settings stayed
    blocked afterwards. The change now resets them for all tracks.
  - **Genius search matches more real pages.** The search title (release qualifiers and guest
    credits stripped) is compared as well as the raw title, `full_title` is accepted, a hit is
    matched when any of its `artist_names` fits the track artist (collab pages are often owned by
    another act), and `artist_names` is read whether the API sends a string or an array. A search
    that returns hits but no acceptable match is retried once without the artist.
  - **The scrape no longer starts with the contributor banner.** Genius marks its "N Contributors /
    Song Lyrics" header `data-exclude-from-selection="true"` inside the first lyric container;
    it was concatenated into the payload, so the player showed the credit block as the first
    lyric lines.
  - **Genius reports a failure hidden in a 200 body.** `meta.status` is now checked, so a token the
    API refuses inside a successful HTTP response is reported as `API 401 (token rejected)`
    instead of `0 hits`.
  ## v0.11.0.0
  ### Fixes
  - **Changing the sources takes effect immediately.** A track that missed under the previous
    configuration stayed blocked by its retry window (1/3/7/30 days), so enabling a source,
    changing the order or installing a fix appeared to do nothing. A change of the source
    configuration — or of the plugin version — now clears the retry windows for one sweep.
  - **A deleted lyric file no longer breaks the lyrics endpoint.** Jellyfin keeps a lyric stream in
    its database after the `.lrc` is removed, so opening it failed with
    `Could not find file '...lrc'` and `GET /Audio/{id}/Lyrics` answered 500. The plugin now logs
    the stale stream and serves freshly fetched lyrics instead. Rescan the library to drop it.
  - **Lyrics live for exactly one track.** The in-memory window kept the last 4 tracks for 2 hours;
    it now keeps only the track being resolved. Changing song replaces them, and a track with no
    lyrics drops the previous ones instead of leaving them behind. A restart leaves nothing.
  ## v0.10.0.0
  ### Fixes
  - **Genius returns results now.** The search response was parsed without mapping the payload's
    keys: Genius answers with `response`, `hits`, `result`, `url`, `title` and `primary_artist`,
    while the properties were `Response`, `Hits`, `Result`, ... and `PrimaryArtist`. Nothing bound,
    so every hit was dropped and the source looked like it had no match even for tracks Genius
    holds. The keys are mapped explicitly, and a search that returns hits but no acceptable match
    is now visible with debug logging.
  - **LRCLIB parses its payload explicitly too**, so its mapping no longer depends on the
    serializer's case-sensitivity default.
  - **The miss line says what was actually queried.** A source still inside its retry window is
    skipped, but was previously named in `no lyrics found for "<title>" in <sources>` as if it had
    been tried. Skips are now listed separately, and a track whose sources are all in their retry
    window gets its own line with the manual-search hint.
  ## v0.9.0.0
  ### Fixes
  - **Settings no longer fail silently.** The page posts the configuration, reads it back and
    re-renders from the server's copy, so an update the server does not store shows up immediately
    instead of after the next restart. A failed request now prints the HTTP status in the page
    rather than doing nothing.
  - **The settings page runs again on Jellyfin 12.** Its script sat outside the
    `data-role="page"` element. Jellyfin's view loader only executes an inline script it finds
    inside that element (it inserts the view through jQuery when one is present), so the page's
    JavaScript never ran: no value was loaded and the Save button had no handler, which looks
    exactly like "settings are not saved". The script now sits inside the page element and
    initialises on DOM ready instead of relying on the view manager's `viewshow` event alone.
  - The dashboard helpers `Dashboard.alert` and `processServerConfigurationUpdateResult` are now
    optional, so a web client that does not expose them cannot abort a save.
  ## v0.8.0.0
  ### Fixes
  - **The settings page says which build it is.** It prints its own version next to the version
    Jellyfin logs at startup, so an old cached page or an un-upgraded install can no longer be
    mistaken for the current page. A validator check keeps the printed number equal to the
    assembly version.
  - **The page no longer claims behaviour that was removed in 0.7.0.0.** The intro said the plugin
    writes a sidecar per track, and that the plugin logs a loaded line at startup. Nothing is
    written to disk any more, and the loaded line comes from Jellyfin itself
    ("Loaded plugin: Multi-Lyrics <version>").
  ## v0.7.0.0
  ### Changes
  - **Lyrics are ephemeral now.** The plugin no longer writes `.lrc` / `.txt` sidecars next to
    your audio or into Jellyfin's metadata folder, and the scheduled task is gone. A track is
    fetched when a client asks for it and held in memory (LRU of the last 4 tracks, 2 h TTL);
    the oldest entry is dropped as you move on. Nothing the plugin produces can appear in a
    library scan, and there is nothing to clean up.
  - **The persistent cache no longer stores lyric text.** `cache.json` keeps per-source
    attempts, the winning source and the retry window only, so text cannot linger on disk.
    Existing cache files are rewritten without text on the next save.
  - **Settings page rebuilt.** Source priority is now an explicit per-source priority number
    (1..4, each used once) plus an enable toggle. The alignment-service, files-and-matching,
    scheduled-task and track-status sections were removed; those values keep the recommended
    defaults (write policy and task caps no longer apply).
  - **Status API** reports whether the lyrics are held in memory and whether the track is
    instrumental, instead of reporting sidecar paths.
  ## v0.6.0.0
  ### Fixes
  - **Tracks with release qualifiers in the title are found now.** Sources were queried with the
    raw Jellyfin title, so "Carnage (feat. Little Simz) (Original Mix)" matched nothing while
    LRCLIB holds it as "Carnage" (verified live: raw title 404 / 0 results, cleaned title 200 with
    synced lyrics). Search terms drop guest credits and release qualifiers (feat, remaster, edit,
    original mix, explicit, year, ...) while keeping qualifiers that change the recording (live,
    acoustic, remix). Multi-artist values are reduced to the first act for lookup.
  - **Read-only media mounts no longer lose lyrics.** When a beside-media write fails (the normal
    Docker case: `:ro` library), the result is written to Jellyfin's metadata folder instead and
    indexed from there, so it is still served by GET /Audio/{id}/lyrics. Logged once per run.
  - **Slow sources can no longer starve the queue.** Per-source HTTP timeouts are now 8-10 s
    (Tekstowo was 25 s, i.e. the whole on-demand budget) and the on-demand budget is 40 s, so all
    four sources get a turn.
  - **Genius exclusion is visible in the log.** When Genius is in the configured order but skipped
    (off, no ToS acknowledgement, mode Off, no token) the reason is logged once at startup instead
    of failing silently. Each miss also logs the sources that were tried.
  ## v0.5.0.0
  ### Fixes
  - **Jellyfin 12 starts again with the plugin installed.** Jellyfin builds its provider manager
    with the lyric manager as a constructor dependency, and this plugin's delivery path needs the
    provider manager back. Resolving that path inside the lyric manager's constructor closed the
    cycle and stalled startup right after "Prepare system for possible migrations". The decorator
    now resolves its own services on first use, so it is a leaf at construction time.
  ## v0.4.0.0
  ### Fixes
  - Lyrics now reach the player. The plugin registers a decorator for Jellyfin's lyric manager,
    so GET /Audio/{id}/Lyrics serves a written sidecar immediately (no library scan needed) and
    can fetch a missing track on demand instead of returning 404.
  - Word-level cues (<mm:ss.xx> tags) are passed through to the API, so enhanced LRC from the
    alignment service is shown as cues by clients that support them.
  - The task rewrites a sidecar from the cache when the file was deleted, and no longer
    re-queries tracks whose sidecar already exists in the media or metadata folder.
  - Metadata-folder sidecars are created, detected and reported by the status API.
  ### Packaging
  - The catalog manifest keeps its version history: every release appends its entries and the
    workflow publishes the merged manifest to the default branch automatically.
  ## v0.3.0.0
  ### Fixes
  - Written sidecars are re-indexed immediately: the task now queues a metadata refresh for
    each item, so the web client's Lyrics view stops reporting "No lyrics found" until the
    next full library scan.
  - On-demand search logging: the lyric provider now logs requests and result counts, and
    reports when it is disabled by the fetch-on-demand setting.
  - The plugin's startup line reported 0.1.0.0 because the assembly version was unpinned;
    csproj and build.yaml now agree and a validator check keeps them in sync.
  ## v0.2.0.0
  ### Changes
  - Removed the Musixmatch source: upstream disabled self-service signup, so the key could not
    be obtained by new users, and synced lyrics required a paid plan anyway.
  - Every setting has a working default now; the settings page shows the default when a stored
    value is missing or out of range, and gained a "Restore defaults" button.
  - Startup and per-run logging: a loaded line at server start and the enabled source list at
    each run, so a fresh install no longer looks silent.
  ## v0.1.0.0
  ### Features
  - Multi-source priority queue: LRCLIB (synced), lyrics.ovh (plain), Tekstowo (plain),
    Genius (search-only or scrape, OFF by default).
  - Sync-status transparency everywhere (Synced / Plain / Instrumental).
  - Scheduled task with rate limiting, per-track retry schedule (1/3/7/30 days) and run cap.
  - Sidecar writer: atomic, path-traversal safe, never downgrades synced to plain.
  - Optional companion alignment service (Demucs + WhisperX) turns plain lyrics into
    word-level .lrc.
  - Admin-only manual search + status API: POST /MultiLyrics/Search/{itemId}, GET /MultiLyrics/Status/{itemId}.
  - Builds for Jellyfin 10.11 (net9.0) and 12.x (net10.0) with -p:JellyfinTarget=jf12.
